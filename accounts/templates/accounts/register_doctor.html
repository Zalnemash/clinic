{% extends "accounts/base.html" %}

{% block title %}Register Doctor{% endblock %}

{% block content %}
<h2 class="mt-4">Register as Doctor</h2>

<form method="post" class="mt-3">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input type="password" name="password2" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Specialty</label>
    <input type="text" name="specialty" class="form-control">
  </div>

  <div class="mb-3">
    <label class="form-label">Clinic Room</label>
    <input type="text" name="clinic_room" class="form-control">
  </div>

  <div class="mb-3">
    <label class="form-label">Bio</label>
    <textarea name="bio" class="form-control" rows="3"></textarea>
  </div>

  <button type="submit" class="btn btn-info">Create Doctor Account</button>
</form>
{% endblock %}
