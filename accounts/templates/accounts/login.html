{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<!-- Centered Logo -->
<div class="text-center mt-4">
    <img src="{% static 'images/logo.png' %}"
         alt="Logo"
         style="width:160px; margin-bottom: 20px;">
</div>

<h2 class="text-center mb-4">Login</h2>

<form method="post" class="mt-3" style="max-width: 400px; margin: auto;">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required>
  </div>

  <button type="submit" class="btn btn-primary w-100">Login</button>
</form>

<hr style="max-width: 400px; margin: 30px auto;">

<p class="text-center">
  Don’t have an account?<br>
  <a href="{% url 'register_patient' %}">Register as Patient</a> |
  <a href="{% url 'register_doctor' %}">Register as Doctor</a>
</p>

{% endblock %}
