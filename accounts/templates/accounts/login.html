<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clinic Appointment Manager - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f6fa;
        }
        h1 {
            color: #2c3e50;
        }
        .box {
            padding: 20px;
            border: 1px solid #ddd;
            width: 320px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #fff;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover {
            background: #2980b9;
        }
        #result {
            white-space: pre-wrap;
            font-family: monospace;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .note {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

<h1>Clinic Appointment Manager - Login</h1>

<div class="box">
    <h3>JWT Login</h3>
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>

    <p class="note">
        Try users you already created, for example:<br>
        <strong>Doctor:</strong> DrHala / pass123<br>
        <strong>Patient:</strong> PatientAli / pass123
    </p>
</div>

<h3>Login Response (Tokens)</h3>
<div id="result">No request yet.</div>

<script>
async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
        alert("Please enter username and password.");
        return;
    }

    const response = await fetch("/api/token/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    document.getElementById("result").textContent = JSON.stringify(data, null, 2);

    if (response.ok && data.access) {
        // Save tokens to localStorage for other pages (like doctor calendar)
        localStorage.setItem("access", data.access);
        localStorage.setItem("refresh", data.refresh);
        alert("Login successful! Access token saved in browser.");
    } else {
        alert("Login failed. Check username/password.");
    }
}
</script>

</body>
</html>
