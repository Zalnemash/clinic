{% extends "accounts/base.html" %}

{% block title %}Book Appointment{% endblock %}

{% block content %}

<h2 class="mt-4">Book an Appointment</h2>

<form method="POST" id="bookingForm">
    {% csrf_token %}

    <!-- Select Doctor -->
    <label class="mt-3">Select Doctor:</label>
    <select id="doctor" name="doctor" class="form-control" required>
        <option value="">-- Choose Doctor --</option>
        {% for d in doctors %}
            <option value="{{ d.user.username }}">{{ d.user.username }} ({{ d.specialty }})</option>
        {% endfor %}
    </select>

    <!-- Available Dates -->
    <label class="mt-3">Select Date:</label>
    <select id="date" name="date" class="form-control" required>
        <option value="">-- Select Doctor First --</option>
    </select>

    <!-- Available Slots -->
    <label class="mt-3">Select Time Slot:</label>
    <select id="time" name="time" class="form-control" required>
        <option value="">-- Select Date First --</option>
    </select>

    <button type="submit" class="btn btn-primary mt-4">Book Appointment</button>
</form>


<script>
/* =======================================================
   HELPER — JWT Token loaded from Django session
   ======================================================= */
const ACCESS_TOKEN = window.JWT_ACCESS || "";

if (!ACCESS_TOKEN) {
    console.warn("⚠ No JWT token found — API calls will fail with 401");
}


/* =======================================================
   Load available dates for selected doctor
   ======================================================= */
document.getElementById("doctor").addEventListener("change", async function () {
    const doc = this.value;
    const dateSelect = document.getElementById("date");
    const timeSelect = document.getElementById("time");

    dateSelect.innerHTML = "<option>Loading...</option>";
    timeSelect.innerHTML = "<option>-- Select Date First --</option>";

    if (!doc) return;

    try {
        const response = await fetch(`/api/doctor/${doc}/available-dates/`, {
            headers: {
                "Authorization": "Bearer " + ACCESS_TOKEN
            }
        });

        if (!response.ok) {
            dateSelect.innerHTML = "<option>Unauthorized (401)</option>";
            return;
        }

        const data = await response.json();

        if (!data.available_dates) {
            dateSelect.innerHTML = "<option>No dates available</option>";
            return;
        }

        dateSelect.innerHTML = '<option value="">-- Select Date --</option>';
        data.available_dates.forEach(d => {
            dateSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });

    } catch (err) {
        console.error(err);
        dateSelect.innerHTML = "<option>Error loading dates</option>";
    }
});


/* =======================================================
   Load time slots when a date is selected
   ======================================================= */
document.getElementById("date").addEventListener("change", async function () {
    const doc = document.getElementById("doctor").value;
    const date = this.value;
    const timeSelect = document.getElementById("time");

    timeSelect.innerHTML = "<option>Loading...</option>";

    if (!doc || !date) return;

    try {
        const response = await fetch(`/api/doctor/${doc}/available-slots/?date=${date}`, {
            headers: {
                "Authorization": "Bearer " + ACCESS_TOKEN
            }
        });

        if (!response.ok) {
            timeSelect.innerHTML = "<option>Unauthorized (401)</option>";
            return;
        }

        const data = await response.json();

        if (!data.slots || data.slots.length === 0) {
            timeSelect.innerHTML = "<option>No available slots</option>";
            return;
        }

        timeSelect.innerHTML = `<option value="">-- Select Time --</option>`;

        data.slots.forEach(slot => {
            timeSelect.innerHTML += `
                <option value="${slot.start}" data-end="${slot.end}">
                    ${slot.label}
                </option>
            `;
        });

    } catch (err) {
        console.error(err);
        timeSelect.innerHTML = "<option>Error loading slots</option>";
    }
});


/* =======================================================
   Auto-generate hidden start/end time before submission
   ======================================================= */
document.getElementById("bookingForm").addEventListener("submit", function () {
    const timeSelect = document.getElementById("time");
    const selectedOption = timeSelect.options[timeSelect.selectedIndex];

    if (!selectedOption) return;

    const start = selectedOption.value;
    const end = selectedOption.getAttribute("data-end");

    this.insertAdjacentHTML("beforeend", `
        <input type="hidden" name="start_time" value="${start}">
        <input type="hidden" name="end_time" value="${end}">
    `);
});
</script>

{% endblock %}
